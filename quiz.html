<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI FlashLearn - Quiz</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            min-height: 100vh;
            color: #1e293b;
            padding: 20px;
        }

        .quiz-container {
            width: 100%;
            max-width: 750px;
            margin: 30px auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .back-btn {
            border: none;
            background: white;
            color: #4f46e5;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .back-btn:hover {
            background: #eef2ff;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .quiz-header {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
            margin-bottom: 20px;
        }

        .question-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #64748b;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #4f46e5;
            border-radius: 10px;
            transition: width 0.3s;
        }

        .quiz-card {
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
        }

        .category {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        #question {
            font-size: 25px;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
            color: #334155;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #6366f1;
            background: #f8f7ff;
        }

        .option.correct {
            background: #dcfce7;
            border-color: #16a34a;
            color: #166534;
        }

        .option.wrong {
            background: #fee2e2;
            border-color: #dc2626;
            color: #991b1b;
        }

        .option:disabled {
            cursor: default;
        }

        .result-message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
        }

        .next-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            background: #3730a3;
        }

        /* Result Screen */

        .result-screen {
            display: none;
            background: white;
            padding: 45px 30px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .result-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .result-screen h1 {
            margin-bottom: 10px;
        }

        .score {
            font-size: 45px;
            color: #4f46e5;
            font-weight: bold;
            margin: 20px 0;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 25px 0;
        }

        .result-box {
            background: #f8fafc;
            padding: 18px 10px;
            border-radius: 12px;
        }

        .result-box strong {
            display: block;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .result-box span {
            color: #64748b;
            font-size: 13px;
        }

        .restart-btn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }

        .dashboard-btn {
            border: none;
            background: #334155;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .quiz-container {
                margin: 15px auto;
            }

            .quiz-card {
                padding: 22px 18px;
            }

            #question {
                font-size: 21px;
            }

            .option {
                padding: 14px;
            }

            .result-details {
                grid-template-columns: 1fr;
            }

            .topbar {
                margin-bottom: 15px;
            }

        }

    </style>

</head>


<body>


<div class="quiz-container">


    <!-- TOP BAR -->

    <div class="topbar">

        <button
            class="back-btn"
            onclick="goDashboard()">

            ← Dashboard

        </button>

        <div class="logo">
            🧠 AI FlashLearn
        </div>

    </div>


    <!-- QUIZ HEADER -->

    <div class="quiz-header">

        <div class="question-info">

            <span id="questionNumber">
                Question 1 / 10
            </span>

            <span id="scoreText">
                Score: 0
            </span>

        </div>


        <div class="progress-bar">

            <div
                class="progress"
                id="progress">
            </div>

        </div>

    </div>


    <!-- QUIZ CARD -->

    <div
        class="quiz-card"
        id="quizCard">


        <span
            class="category"
            id="category">

            JavaScript

        </span>


        <h2 id="question">
            Question
        </h2>


        <div
            class="options"
            id="options">
        </div>


        <div
            class="result-message"
            id="resultMessage">
        </div>


        <button
            class="next-btn"
            id="nextButton"
            onclick="nextQuestion()">

            Next Question →

        </button>


    </div>


    <!-- RESULT SCREEN -->

    <div
        class="result-screen"
        id="resultScreen">


        <div class="result-icon">
            🎉
        </div>


        <h1>
            Quiz Complete!
        </h1>


        <p>
            Great job! Here is your result.
        </p>


        <div
            class="score"
            id="finalScore">

            0 / 10

        </div>


        <div class="result-details">


            <div class="result-box">

                <strong
                    id="correctCount">
                    0
                </strong>

                <span>
                    Correct
                </span>

            </div>


            <div class="result-box">

                <strong
                    id="wrongCount">
                    0
                </strong>

                <span>
                    Wrong
                </span>

            </div>


            <div class="result-box">

                <strong
                    id="accuracy">
                    0%
                </strong>

                <span>
                    Accuracy
                </span>

            </div>


        </div>


        <button
            class="restart-btn"
            onclick="restartQuiz()">

            🔄 Try Again

        </button>


        <button
            class="dashboard-btn"
            onclick="goDashboard()">

            🏠 Dashboard

        </button>


    </div>


</div>



<script>


/* ================= QUESTION BANK ================= */


const questions = [

    {
        category: "JavaScript",
        question: "What is JavaScript?",
        options: [
            "A programming language",
            "A database",
            "An operating system",
            "A web browser"
        ],
        answer: 0
    },


    {
        category: "HTML",
        question: "What does HTML stand for?",
        options: [
            "Hyper Text Markup Language",
            "High Text Machine Language",
            "Hyper Transfer Markup Language",
            "Home Tool Markup Language"
        ],
        answer: 0
    },


    {
        category: "CSS",
        question: "What is CSS mainly used for?",
        options: [
            "Creating databases",
            "Styling web pages",
            "Writing server code",
            "Creating operating systems"
        ],
        answer: 1
    },


    {
        category: "JavaScript",
        question: "Which keyword is used to declare a variable in JavaScript?",
        options: [
            "var",
            "define",
            "variable",
            "declare"
        ],
        answer: 0
    },


    {
        category: "HTML",
        question: "Which tag is used to create a paragraph?",
        options: [
            "<h1>",
            "<p>",
            "<div>",
            "<text>"
        ],
        answer: 1
    },


    {
        category: "CSS",
        question: "Which CSS property changes text color?",
        options: [
            "font",
            "background",
            "color",
            "text-style"
        ],
        answer: 2
    },


    {
        category: "JavaScript",
        question: "Which symbol is used for a single-line comment?",
        options: [
            "<!-- -->",
            "//",
            "#",
            "/* */"
        ],
        answer: 1
    },


    {
        category: "HTML",
        question: "Which tag is used to create a hyperlink?",
        options: [
            "<link>",
            "<a>",
            "<href>",
            "<url>"
        ],
        answer: 1
    },


    {
        category: "CSS",
        question: "Which property is used to change background color?",
        options: [
            "background-color",
            "color",
            "bg-color",
            "background-style"
        ],
        answer: 0
    },


    {
        category: "JavaScript",
        question: "Which method converts JSON text into a JavaScript object?",
        options: [
            "JSON.parse()",
            "JSON.convert()",
            "JSON.object()",
            "JSON.toObject()"
        ],
        answer: 0
    }

];


let currentQuestion = 0;
let score = 0;
let correctAnswers = 0;
let wrongAnswers = 0;


/* ================= ELEMENTS ================= */


const questionElement =
    document.getElementById("question");

const optionsElement =
    document.getElementById("options");

const categoryElement =
    document.getElementById("category");

const questionNumberElement =
    document.getElementById("questionNumber");

const scoreTextElement =
    document.getElementById("scoreText");

const progressElement =
    document.getElementById("progress");

const resultMessageElement =
    document.getElementById("resultMessage");

const nextButton =
    document.getElementById("nextButton");

const quizCard =
    document.getElementById("quizCard");

const resultScreen =
    document.getElementById("resultScreen");


/* ================= LOAD QUESTION ================= */


function loadQuestion() {


    const current = questions[currentQuestion];


    questionElement.textContent =
        current.question;


    categoryElement.textContent =
        current.category;


    questionNumberElement.textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;


    scoreTextElement.textContent =
        `Score: ${score}`;


    const progressPercent =
        ((currentQuestion + 1) / questions.length) * 100;


    progressElement.style.width =
        progressPercent + "%";


    optionsElement.innerHTML = "";


    resultMessageElement.style.display =
        "none";


    nextButton.style.display =
        "none";


    current.options.forEach(function(option, index) {


        const button =
            document.createElement("button");


        button.className =
            "option";


        button.textContent =
            `${String.fromCharCode(65 + index)}. ${option}`;


        button.onclick =
            function() {

                selectAnswer(index, button);

            };


        optionsElement.appendChild(button);

    });

}


/* ================= ANSWER ================= */


function selectAnswer(selectedIndex, selectedButton) {


    const current =
        questions[currentQuestion];


    const allOptions =
        document.querySelectorAll(".option");


    allOptions.forEach(function(button) {

        button.disabled = true;

    });


    if (selectedIndex === current.answer) {


        selectedButton.classList.add("correct");

        correctAnswers++;

        score += 10;

        resultMessageElement.textContent =
            "✅ Correct! Great job.";

        resultMessageElement.style.background =
            "#dcfce7";

        resultMessageElement.style.color =
            "#166534";


    } else {


        selectedButton.classList.add("wrong");


        allOptions[current.answer]
            .classList.add("correct");


        wrongAnswers++;


        resultMessageElement.textContent =
            `❌ Wrong! Correct answer: ${current.options[current.answer]}`;

        resultMessageElement.style.background =
            "#fee2e2";

        resultMessageElement.style.color =
            "#991b1b";

    }


    resultMessageElement.style.display =
        "block";


    scoreTextElement.textContent =
        `Score: ${score}`;


    nextButton.style.display =
        "block";

}


/* ================= NEXT ================= */


function nextQuestion() {


    currentQuestion++;


    if (currentQuestion < questions.length) {


        loadQuestion();


    } else {


        showResult();

    }

}


/* ================= RESULT ================= */


function showResult() {


    quizCard.style.display =
        "none";


    resultScreen.style.display =
        "block";


    const total =
        questions.length;


    const accuracy =
        Math.round(
            (correctAnswers / total) * 100
        );


    document.getElementById("finalScore")
        .textContent =
        `${correctAnswers} / ${total}`;


    document.getElementById("correctCount")
        .textContent =
        correctAnswers;


    document.getElementById("wrongCount")
        .textContent =
        wrongAnswers;


    document.getElementById("accuracy")
        .textContent =
        accuracy + "%";

    // Save latest accuracy for Dashboard
    localStorage.setItem("lastQuizAccuracy", accuracy);

    // Save quiz result history for Dashboard
    const quizHistory = JSON.parse(
        localStorage.getItem("quizHistory") || "[]"
    );

    quizHistory.push({
        date: new Date().toLocaleDateString(),
        score: correctAnswers,
        total: total,
        accuracy: accuracy
    });

    localStorage.setItem(
        "quizHistory",
        JSON.stringify(quizHistory)
    );

}


/* ================= RESTART ================= */


function restartQuiz() {


    currentQuestion = 0;

    score = 0;

    correctAnswers = 0;

    wrongAnswers = 0;


    quizCard.style.display =
        "block";


    resultScreen.style.display =
        "none";


    loadQuestion();

}


/* ================= DASHBOARD ================= */


function goDashboard() {

    window.location.href =
        "dashboard.html";

}


/* ================= START ================= */


loadQuestion();


</script>


</body>

</html>
