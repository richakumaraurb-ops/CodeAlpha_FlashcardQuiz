<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flashcard Quiz App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="theme-button">
            <button id="darkModeToggle">🌙 Dark Mode</button>
        </div>

        <h1>Flashcard Quiz</h1>

        <div class="flashcard">

            <h2 id="question"></h2>

            <p id="answer" class="hidden"></p>

            <button id="showAnswer">Show Answer</button>

        </div>


        <div class="navigation">

            <button id="previous">Previous</button>

            <span id="counter">1 / 3</span>

            <button id="next">Next</button>

        </div>


        <div class="actions">

            <button id="addCard">Add Card</button>

            <button id="editCard">Edit Card</button>

            <button id="deleteCard">Delete Card</button>

        </div>


        <div id="cardForm" class="card-form hidden">

            <h2 id="formTitle">Add New Flashcard</h2>

            <input
                type="text"
                id="newQuestion"
                placeholder="Enter question"
            >

            <textarea
                id="newAnswer"
                placeholder="Enter answer"
            ></textarea>


            <div>

                <button id="saveCard">Save Card</button>

                <button id="cancelCard">Cancel</button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
