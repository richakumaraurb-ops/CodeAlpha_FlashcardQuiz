<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI FlashLearn - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #3730a3;
        }

        .divider {
            text-align: center;
            margin: 22px 0;
            color: #94a3b8;
        }

        .signup {
            text-align: center;
            color: #64748b;
        }

        .signup a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🧠</div>

        <h1>AI FlashLearn</h1>

        <p class="subtitle">
            Learn smarter. Practice better.
        </p>

        <form id="loginForm">

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button class="login-btn" type="submit">
                Login
            </button>

        </form>

        <div class="divider">
            ─────── OR ───────
        </div>

        <div class="signup">
            Don't have an account?
            <a href="#">Create Account</a>
        </div>

    </div>

    <script>

        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;

            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("userEmail", email);

            window.location.href = "dashboard.html";

        });

    </script>

</body>

</html>
